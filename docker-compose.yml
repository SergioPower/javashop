services:
  postgres:
    image: postgres:17
    container_name: javashop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: javashop
      POSTGRES_USER: javashop
      POSTGRES_PASSWORD: javashop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: